<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Iron Nest – Heavy Artillery Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui">
    <h1>Iron Nest</h1>
    <div class="controls">
      <label>
        Angle:
        <input type="range" id="angle" min="10" max="80" value="45" />
        <span id="angleValue">45°</span>
      </label>
      <label>
        Power:
        <input type="range" id="power" min="10" max="60" value="30" />
        <span id="powerValue">30</span>
      </label>
      <button id="fireBtn">Fire</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Iron Nest – Map Missions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="ui">
  <h1>Iron Nest – Mission Control</h1>

  <div class="missionBox">
    <p><strong>Mission:</strong> Hit target at <span id="missionCoords"></span></p>
  </div>

  <div class="controls">
    <button id="mapBtn">Show Map</button>

    <label>Angle:
      <input type="number" id="angleInput" value="45" />
    </label>

    <label>Power:
      <input type="number" id="powerInput" value="30" />
    </label>

    <label>Shell Type:
      <select id="shellType">
        <option value="light">Light</option>
        <option value="medium">Medium</option>
        <option value="heavy">Heavy</option>
      </select>
    </label>

    <button id="fireBtn">Fire</button>
    <button id="newMissionBtn">New Mission</button>
  </div>
</div>

<canvas id="gameCanvas"></canvas>

<script src="main.js"></script>
</body>
</html>
